volume-max=200
af=acompressor
sub-auto=fuzzy
# sub-bold=yes
sub-font="Source Serif Pro"
hwdec=auto
save-position-on-quit

# Display current file/song title prominently
term-osd-bar                    # Show progress bar in terminal
term-osd-bar-chars="[=>-]"      # Progress bar style
term-title="${media-title}"     # Set terminal title to current song
osd-playing-msg="${media-title}"
osd-playing-msg-duration=3000   # Show for 3 seconds
term-status-msg="\x1b[32m${media-title}\x1b[0m - ${time-pos}/${duration}"
